name: regression

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install playwright mcp
          python -m playwright install --with-deps chromium

      - name: 登录回归（case-runner 用例库，无副作用）
        env:
          TEST_WS: ${{ github.workspace }}
        run: python .reasonix/mcp/case-runner.py --cases .reasonix/tmp/login-cases.json

      - name: 注册回归（case-runner 用例库）
        env:
          TEST_WS: ${{ github.workspace }}
        run: python .reasonix/mcp/case-runner.py --cases .reasonix/tmp/register-cases.json

      - name: 全站探索回归（case-runner 用例库）
        env:
          TEST_WS: ${{ github.workspace }}
        run: python .reasonix/mcp/case-runner.py --cases .reasonix/tmp/explore-cases.json

      - name: 生成报告（版本与数据对齐）
        env:
          TEST_WS: ${{ github.workspace }}
        run: |
          python .reasonix/tmp/gen-report.py login 4
          python .reasonix/tmp/gen-report.py register 5
          python .reasonix/tmp/gen-report.py explore 2

      - name: 上传报告制品
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            自动化测试平台-*.html
            .reasonix/tmp/*-test-results-*.json
          retention-days: 30
