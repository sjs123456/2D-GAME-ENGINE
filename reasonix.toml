Mesh.geometry.attributes.position.array[1] : -1});\n})()`));\nconst shot = await send(\"Page.captureScreenshot\", {format: \"png\"});\nconst fs = await import(\"fs\");\nfs.writeFileSync(process.cwd() + \"/shot_fixed.png\", Buffer.from(shot.data, \"base64\"));\nconsole.log(\"截图:\", fs.statSync(process.cwd() + \"/shot_fixed.png\").size);\nws.close();\nEOF\nnode \"C:\\Users\\ahusj\\.agents\\skills\\browser-cdp\\scripts\\setup-cdp-chrome.js\" 9222 --yes >/dev/null 2>&1 && curl -s -m 5 http://127.0.0.1:9222/json/version >/dev/null && node /tmp/cdp_fix.mjs", "Bash=cd auction-king && cat > /tmp/sim_test.js << 'EOF'\nconst fs = require('fs');\neval(fs.readFileSync('js/items.js','utf8'));\neval(fs.readFileSync('js/bidders.js','utf8'));\nlet fallCount = 0, total = 0;\nfor (const lv of LEVELS) {\n  for (const ii of lv.items) {\n    const item = ITEMS[ii];\n    const bidders = makeBidders(lv.crowd, item);\n    let price = item.base, steps = 0;\n    const minStep = Math.max(10, Math.round(item.base*0.04));\n    while (true) {\n      const elig = bidders.filter(b => b.active && b.psych >= price + minStep);\n      if (!elig.length) break;\n      const b = elig[Math.floor(Math.random()*elig.length)];\n      const step = Math.max(10, Math.round(item.base * 0.045 * b.stepMult * (0.7 + Math.random()*0.9) / 10) * 10);\n      price += step; steps++;\n      bidders.forEach(x => { if (x.active && x.psych < price + minStep) x.active = false; });\n      if (steps > 200) { console.log('!! 死循环'); process.exit(1); }\n    }\n    const psychs = bidders.map(b=>b.psych).join(',');\n    console.log(`${lv.name.padEnd(5)} ${item.name.padEnd(7)} 起拍${item.base} 甜区[${item.sweetLo},${item.sweetHi}] 终价${price} 步数${steps} | 心理价:${psychs}`);\n    if (price > item.sweetHi) fallCount++;\n    total++;\n  }\n}\nconsole.log(`\\n→ 不落锤最终超过甜区上沿（必流拍）: ${fallCount}/${total} 件 ✓`);\nEOF\nnode /tmp/sim_test.js"]

