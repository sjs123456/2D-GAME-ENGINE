<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方块大陆 VoxelCraft — 网页版沙盒建造</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#87ceeb; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; user-select:none; }
  canvas { display:block; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; background:rgba(10,14,20,0.72); backdrop-filter:blur(3px); }
  .panel { background:#1d2733; border:1px solid #33455c; border-radius:12px; color:#e8eef5; padding:28px 34px; max-width:540px; width:92%; max-height:92vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  h1 { font-size:26px; margin-bottom:2px; letter-spacing:1px; }
  .sub { color:#8fa3b8; font-size:13px; margin-bottom:16px; }
  .btn { display:block; width:100%; margin:8px 0; padding:11px 0; font-size:15px; border:none; border-radius:8px; cursor:pointer; background:#2e8b57; color:#fff; transition:.15s; }
  .btn:hover { background:#3aa06a; }
  .btn.alt { background:#3b4a5e; } .btn.alt:hover { background:#4a5d75; }
  .btn.danger { background:#a0483b; } .btn.danger:hover { background:#b85648; }
  .keys { font-size:13px; line-height:2.0; color:#c3d0dd; }
  .keys b { display:inline-block; min-width:24px; text-align:center; background:#2c3a4b; border:1px solid #46586e; border-radius:5px; padding:0 6px; margin-right:6px; font-weight:600; }
  .row { display:flex; align-items:center; justify-content:space-between; font-size:13px; color:#c3d0dd; margin-top:10px; }
  input[type=range]{ width:160px; }
  .note { margin-top:14px; font-size:11px; color:#6d8096; }
  #loading { background:rgba(10,14,20,0.92); color:#e8eef5; text-align:center; }
  #loading .bar { width:70%; max-width:400px; height:10px; background:#263443; border-radius:5px; margin:16px auto; overflow:hidden; }
  #loading .fill { height:100%; width:0%; background:#2e8b57; transition:width .2s; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; display:none; }
  #crosshair { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:22px; height:22px; }
  #crosshair::before,#crosshair::after{ content:""; position:absolute; background:rgba(255,255,255,.9); mix-blend-mode:difference; }
  #crosshair::before{ left:50%; top:2px; bottom:2px; width:2px; transform:translateX(-50%); }
  #crosshair::after{ top:50%; left:2px; right:2px; height:2px; transform:translateY(-50%); }
  #info { position:fixed; top:10px; left:10px; background:rgba(0,0,0,.45); color:#dfe8f2; font:12px/1.8 Consolas,monospace; padding:8px 12px; border-radius:6px; min-width:230px; }
  #barwrap { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); text-align:center; }
  #barname { color:#fff; text-shadow:0 1px 3px #000; font-size:13px; margin-bottom:6px; }
  #bar { background:rgba(0,0,0,.45); border-radius:8px; }
  #toast { position:fixed; top:64px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff; padding:8px 16px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .3s; z-index:8; pointer-events:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="info"></div>
  <div id="barwrap">
    <div id="barname"></div>
    <canvas id="bar" width="406" height="46"></canvas>
  </div>
</div>
<div id="toast"></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>⛏ 方块大陆 <span style="color:#7fb069">VoxelCraft</span></h1>
    <div class="sub">网页版沙盒建造 · 全新引擎重写 · 素材全程序化生成</div>
    <button class="btn" id="btnStart">🎮 开始新世界</button>
    <button class="btn alt" id="btnContinue">💾 继续上次的世界</button>
    <div class="keys">
      <div><b>W A S D</b> 移动&nbsp;&nbsp;<b>空格</b> 跳跃&nbsp;&nbsp;<b>Shift</b> 下蹲</div>
      <div><b>F</b> 飞行&nbsp;&nbsp;<b>C</b> 切换视角&nbsp;&nbsp;<b>M</b> 音效</div>
      <div><b>左键</b> 破坏&nbsp;&nbsp;<b>右键</b> 放置&nbsp;&nbsp;<b>1-9/滚轮</b> 选方块</div>
      <div><b>Esc</b> 菜单</div>
    </div>
    <div class="row">
      <span>鼠标灵敏度</span>
      <input type="range" id="sens" min="0.6" max="2.6" step="0.1" value="1.0">
    </div>
    <div class="note">素材说明：地形、纹理、音效全部由代码实时生成；渲染基于 Three.js（本地内置）。纯网页练习作品，与 Mojang 无关。</div>
  </div>
</div>

<div class="overlay hidden" id="loading">
  <div>
    <div style="font-size:22px;margin-bottom:6px">正在生成世界…</div>
    <div id="loadingText" style="font-size:13px;color:#8fa3b8">准备中</div>
    <div class="bar"><div class="fill" id="loadingFill"></div></div>
  </div>
</div>

<div class="overlay hidden" id="pause">
  <div class="panel">
    <h1 style="font-size:22px">⏸ 游戏暂停</h1>
    <div class="sub">鼠标已解锁</div>
    <button class="btn" id="btnResume">▶ 继续游戏</button>
    <button class="btn alt" id="btnSave">💾 保存世界</button>
    <button class="btn alt" id="btnSound">🔊 音效：开</button>
    <button class="btn danger" id="btnRegen">🔄 重新生成世界</button>
  </div>
</div>

<script src="./vendor/three.min.js"></script>
<script>
"use strict";
/* ============================================================
 * 方块大陆 VoxelCraft — 重写版
 * 几何全部使用 Three.js 内置 BoxGeometry/PlaneGeometry（保证
 * winding/UV 正确），InstancedMesh 实例化渲染，杜绝手写几何错误
 * ============================================================ */

/* ---------- 常量 ---------- */
const WX = 64, WY = 40, WZ = 64;   // 世界尺寸
const SEA = 26;                    // 海平面
const REACH = 6;                   // 交互距离
const CAM_DIST = 4.6;              // 第三人称相机距离
const B = { AIR:0, GRASS:1, DIRT:2, STONE:3, LOG:4, LEAVES:5, SAND:6, WATER:7, BEDROCK:8, COAL:9, IRON:10 };
const BNAME = { 1:"草方块", 2:"泥土", 3:"石头", 4:"木头", 5:"树叶", 6:"沙子", 7:"水", 8:"基岩", 9:"煤矿石", 10:"铁矿石" };
const TOOLBAR = [B.GRASS, B.DIRT, B.STONE, B.LOG, B.LEAVES, B.SAND, B.COAL, B.IRON, B.BEDROCK];

/* ---------- 世界存储 ---------- */
const world = new Uint8Array(WX*WY*WZ);
const widx = (x,y,z) => ((x*WZ)+z)*WY + y;
function getBlock(x,y,z){
  if(x<0||y<0||z<0||x>=WX||y>=WY||z>=WZ) return B.STONE; // 边界外视为实心
  return world[widx(x,y,z)];
}
function setBlock(x,y,z,id){ if(x>=0&&y>=0&&z>=0&&x<WX&&y<WY&&z<WZ) world[widx(x,y,z)] = id; }
const isSolid = id => id!==B.AIR && id!==B.WATER;

/* ---------- 噪声（32 位哈希 + value noise + fbm，已验证分布正常） ---------- */
function hash2(x,z){
  let n = Math.imul(x, 374761393) + Math.imul(z, 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function smooth(t){ return t*t*(3-2*t); }
function valueNoise(x,z){
  const xi=Math.floor(x), zi=Math.floor(z);
  const xf=x-xi, zf=z-zi;
  const a=hash2(xi,zi), b=hash2(xi+1,zi), c=hash2(xi,zi+1), d=hash2(xi+1,zi+1);
  const u=smooth(xf), v=smooth(zf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,z){
  let v=0, amp=1, f=1, sum=0;
  for(let i=0;i<4;i++){ v += valueNoise(x*f,z*f)*amp; sum+=amp; amp*=0.5; f*=2; }
  return v/sum;
}

/* ---------- 纹理（16×16 Canvas 程序化） ---------- */
function shade(hex,d){
  const r=Math.max(0,Math.min(255,parseInt(hex.slice(1,3),16)+d));
  const g=Math.max(0,Math.min(255,parseInt(hex.slice(3,5),16)+d));
  const b=Math.max(0,Math.min(255,parseInt(hex.slice(5,7),16)+d));
  return "rgb("+r+","+g+","+b+")";
}
function makeTexture(draw){
  const c=document.createElement("canvas"); c.width=16; c.height=16;
  const g=c.getContext("2d");
  draw(g);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestMipmapNearestFilter;
  t.generateMipmaps=true; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function noiseFill(g,hex,vary,dots){
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){
    g.fillStyle=shade(hex,(Math.random()-0.5)*vary);
    g.fillRect(x,y,1,1);
  }
  if(dots) for(let i=0;i<dots;i++){
    g.fillStyle=shade(hex,(Math.random()-0.5)*vary*1.4);
    g.fillRect(Math.floor(Math.random()*16),Math.floor(Math.random()*16),1,1);
  }
}
const TEX = {
  grassTop:  makeTexture(g=>noiseFill(g,"#63a244",36,18)),
  grassSide: makeTexture(g=>{ noiseFill(g,"#8a6b45",26,10);
    for(let x=0;x<16;x++){ g.fillStyle=shade("#63a244",(Math.random()-0.5)*32); g.fillRect(x,0,1,2); }
    for(let i=0;i<4;i++){ g.fillStyle=shade("#63a244",(Math.random()-0.5)*24); g.fillRect(Math.floor(Math.random()*16),1,1,1); }
  }),
  dirt:      makeTexture(g=>noiseFill(g,"#8a6b45",26,10)),
  stone:     makeTexture(g=>noiseFill(g,"#8f8f8f",24,14)),
  logSide:   makeTexture(g=>{ noiseFill(g,"#6f5233",16,4);
    for(let x=0;x<16;x++){ if(x%4===0){ g.fillStyle=shade("#6f5233",-34); g.fillRect(x,0,1,16); }
      g.fillStyle=shade("#6f5233",12); g.fillRect(x,2,1,1); } }),
  logTop:    makeTexture(g=>{ noiseFill(g,"#a5865a",14,0);
    g.strokeStyle=shade("#a5865a",-40); g.lineWidth=1;
    for(let r=2;r<=7;r+=2){ g.beginPath(); g.arc(7.5,7.5,r,0,7); g.stroke(); } }),
  leaves:    makeTexture(g=>{ noiseFill(g,"#3f7d2e",30,22); }),
  sand:      makeTexture(g=>noiseFill(g,"#ddd3a5",20,8)),
  coal:      makeTexture(g=>{ noiseFill(g,"#6e6e6e",20,8);
    g.fillStyle="#202020"; for(let i=0;i<5;i++) g.fillRect(Math.floor(Math.random()*14),Math.floor(Math.random()*14),2,2); }),
  iron:      makeTexture(g=>{ noiseFill(g,"#9c8a72",16,8);
    g.fillStyle="#c9814f"; for(let i=0;i<4;i++) g.fillRect(Math.floor(Math.random()*14),Math.floor(Math.random()*14),2,2); }),
  water:     makeTexture(g=>noiseFill(g,"#3b6fd4",10,6)),
  bedrock:   makeTexture(g=>noiseFill(g,"#4a4a4a",50,40)),
};

/* ---------- 材质 ---------- */
function lambert(tex,opts){ return new THREE.MeshLambertMaterial(Object.assign({map:tex},opts||{})); }
const M = {
  grassTop: lambert(TEX.grassTop), grassSide: lambert(TEX.grassSide),
  dirt: lambert(TEX.dirt), stone: lambert(TEX.stone),
  logSide: lambert(TEX.logSide), logTop: lambert(TEX.logTop),
  leaves: lambert(TEX.leaves), sand: lambert(TEX.sand),
  coal: lambert(TEX.coal), iron: lambert(TEX.iron),
  water: lambert(TEX.water,{transparent:true,opacity:0.78,depthWrite:false}),
  bedrock: lambert(TEX.bedrock),
};
// BoxGeometry 面序：+x,-x,+y,-y,+z,-z
const MAT_BY_ID = {
  [B.GRASS]:   [M.grassSide, M.grassSide, M.grassTop, M.dirt,     M.grassSide, M.grassSide],
  [B.DIRT]:    [M.dirt, M.dirt, M.dirt, M.dirt, M.dirt, M.dirt],
  [B.STONE]:   [M.stone, M.stone, M.stone, M.stone, M.stone, M.stone],
  [B.LOG]:     [M.logSide, M.logSide, M.logTop, M.logTop, M.logSide, M.logSide],
  [B.LEAVES]:  [M.leaves, M.leaves, M.leaves, M.leaves, M.leaves, M.leaves],
  [B.SAND]:    [M.sand, M.sand, M.sand, M.sand, M.sand, M.sand],
  [B.COAL]:    [M.coal, M.coal, M.coal, M.coal, M.coal, M.coal],
  [B.IRON]:    [M.iron, M.iron, M.iron, M.iron, M.iron, M.iron],
  [B.BEDROCK]: [M.bedrock, M.bedrock, M.bedrock, M.bedrock, M.bedrock, M.bedrock],
};

/* ---------- 场景 / 光照 / 相机 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 46, 150);
scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x7a5c3e, 0.9));
scene.add(new THREE.AmbientLight(0xffffff, 0.4)); // 任何朝向都不纯黑
const sun = new THREE.DirectionalLight(0xfff2cc, 2.2);
sun.position.set(-40, 90, -60);
scene.add(sun);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById("game").appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 400);
camera.rotation.order = "YXZ";
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- 世界生成 ---------- */
function genWorld(){
  world.fill(0);
  for(let x=0;x<WX;x++) for(let z=0;z<WZ;z++) setBlock(x,0,z,B.BEDROCK);
  for(let x=0;x<WX;x++) for(let z=0;z<WZ;z++){
    const e = fbm(x*0.025,z*0.025)*15 + fbm(x*0.08+37.3,z*0.08-11.7)*5 + fbm(x*0.25-13.7,z*0.25+9.1)*2 - 6;
    const h = Math.max(3, Math.min(WY-10, Math.floor(22+e)));
    for(let y=1;y<=h;y++){
      let id;
      if(y===h) id = (h<=SEA)? B.SAND : B.GRASS;
      else if(y>=h-3) id = (h<=SEA)? B.SAND : B.DIRT;
      else id = B.STONE;
      if(id===B.STONE){
        if(y<h-4 && Math.random()<0.008) id=B.COAL;
        else if(y<h-14 && Math.random()<0.004) id=B.IRON;
      }
      setBlock(x,y,z,id);
    }
    for(let y=h+1;y<=SEA;y++) setBlock(x,y,z,B.WATER);
  }
  // 洞穴
  for(let i=0;i<26;i++){
    const cx=6+Math.floor(Math.random()*(WX-12)), cz=6+Math.floor(Math.random()*(WZ-12));
    const cy=5+Math.floor(Math.random()*14), r=2+Math.floor(Math.random()*2);
    for(let dx=-r-1;dx<=r+1;dx++) for(let dy=-r;dy<=r;dy++) for(let dz=-r-1;dz<=r+1;dz++){
      const d2=dx*dx+dy*dy*0.6+dz*dz;
      if(d2<=r*r+Math.random()*0.8 && cy+dy>1){
        const id=getBlock(cx+dx,cy+dy,cz+dz);
        if(id===B.STONE||id===B.DIRT||id===B.COAL||id===B.IRON) setBlock(cx+dx,cy+dy,cz+dz,B.AIR);
      }
    }
  }
  // 树
  for(let i=0;i<110;i++){
    const x=2+Math.floor(Math.random()*(WX-4)), z=2+Math.floor(Math.random()*(WZ-4));
    let y=WY-2; while(y>0 && getBlock(x,y,z)===B.AIR) y--;
    if(getBlock(x,y,z)===B.GRASS && y>SEA+1) genTree(x,y,z);
  }
}
function genTree(x,gy,z){
  const h=4+Math.floor(Math.random()*2);
  for(let i=1;i<=h;i++) setBlock(x,gy+i,z,B.LOG);
  const top=gy+h;
  for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++)
    if(!(dx===0&&dz===0)) setIfAir(x+dx,top,z+dz,B.LEAVES);
  for(let ly=top-1; ly>=top-2; ly--){
    for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++){
      const ax=Math.abs(dx), az=Math.abs(dz);
      if(ax===2 && az===2 && Math.random()<0.6) continue;
      setIfAir(x+dx,ly,z+dz,B.LEAVES);
    }
  }
}
function setIfAir(x,y,z,id){ if(getBlock(x,y,z)===B.AIR) setBlock(x,y,z,id); }

/* ---------- InstancedMesh 渲染（内置几何，无手写 buffer） ---------- */
const boxGeo = new THREE.BoxGeometry(1,1,1);
const worldGroup = new THREE.Group();
scene.add(worldGroup);
let solidMeshes = {};   // id -> InstancedMesh
let waterInst = null;   // 水面 Plane 实例

function hasAirNeighbor(x,y,z){
  return getBlock(x+1,y,z)===B.AIR || getBlock(x-1,y,z)===B.AIR ||
         getBlock(x,y+1,z)===B.AIR || getBlock(x,y-1,z)===B.AIR ||
         getBlock(x,y,z+1)===B.AIR || getBlock(x,y,z-1)===B.AIR ||
         getBlock(x+1,y,z)===B.WATER || getBlock(x-1,y,z)===B.WATER ||
         getBlock(x,y,z+1)===B.WATER || getBlock(x,y,z-1)===B.WATER ||
         getBlock(x,y+1,z)===B.WATER;
}
function rebuildWorld(){
  // 释放旧的
  for(const id in solidMeshes){ worldGroup.remove(solidMeshes[id]); solidMeshes[id].dispose(); }
  solidMeshes = {};
  if(waterInst){ worldGroup.remove(waterInst); waterInst.dispose(); waterInst=null; }
  // 第一遍：统计每类型可见实例数
  const cnt = {};
  for(let x=0;x<WX;x++) for(let z=0;z<WZ;z++) for(let y=1;y<WY;y++){
    const id=getBlock(x,y,z);
    if(!isSolid(id)) continue;
    if(hasAirNeighbor(x,y,z)) cnt[id]=(cnt[id]||0)+1;
  }
  // 第二遍：创建 InstancedMesh 并填充
  const mat = new THREE.Matrix4();
  for(const idStr in cnt){
    const id = +idStr, n = cnt[id];
    const mesh = new THREE.InstancedMesh(boxGeo, MAT_BY_ID[id], n);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    let i=0;
    for(let x=0;x<WX;x++) for(let z=0;z<WZ;z++) for(let y=1;y<WY;y++){
      if(getBlock(x,y,z)!==id || !hasAirNeighbor(x,y,z)) continue;
      mat.setPosition(x+0.5, y+0.5, z+0.5);
      mesh.setMatrixAt(i++, mat);
    }
    mesh.count = n;
    worldGroup.add(mesh);
    solidMeshes[id] = mesh;
  }
  // 水面：仅顶面 Plane（与方块顶面错开 0.002 防 z-fighting，相邻水面不重叠）
  let waterN = 0;
  for(let x=0;x<WX;x++) for(let z=0;z<WZ;z++)
    if(getBlock(x,SEA,z)===B.WATER && getBlock(x,SEA+1,z)===B.AIR) waterN++;
  if(waterN>0){
    const pGeo = new THREE.PlaneGeometry(1,1);
    const rot = new THREE.Matrix4().makeRotationX(-Math.PI/2);
    waterInst = new THREE.InstancedMesh(pGeo, M.water, waterN);
    waterInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    waterInst.renderOrder = 2;
    let i=0;
    for(let x=0;x<WX;x++) for(let z=0;z<WZ;z++){
      if(getBlock(x,SEA,z)!==B.WATER || getBlock(x,SEA+1,z)!==B.AIR) continue;
      mat.copy(rot).setPosition(x+0.5, SEA+1.002, z+0.5);
      waterInst.setMatrixAt(i++, mat);
    }
    waterInst.count = waterN;
    worldGroup.add(waterInst);
  }
}
function rebuildAt(x,y,z){ rebuildWorld(); }

/* ---------- 玩家物理 ---------- */
const PLAYER = { x:WX/2+0.5, y:SEA+8, z:WZ/2+0.5, velY:0, onGround:false, flying:false, sneak:false };
const PLAYER_HW=0.3, PLAYER_H=1.8, EYE=1.62;
const G=24, JUMP=8.6, WALK=4.5, FLY=9.5;
function collides(px,py,pz,h){
  const x0=Math.floor(px-PLAYER_HW), x1=Math.floor(px+PLAYER_HW);
  const y0=Math.floor(py), y1=Math.floor(py+h);
  const z0=Math.floor(pz-PLAYER_HW), z1=Math.floor(pz+PLAYER_HW);
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) for(let z=z0;z<=z1;z++)
    if(isSolid(getBlock(x,y,z))) return true;
  return false;
}
function isInWater(){
  const h=PLAYER.sneak?1.5:PLAYER_H;
  return getBlock(Math.floor(PLAYER.x),Math.floor(PLAYER.y+h*0.8),Math.floor(PLAYER.z))===B.WATER ||
         getBlock(Math.floor(PLAYER.x),Math.floor(PLAYER.y),Math.floor(PLAYER.z))===B.WATER;
}
function moveAxis(axis,d){
  if(d===0) return false;
  const h=PLAYER.sneak?1.5:PLAYER_H;
  PLAYER[axis]+=d;
  if(!collides(PLAYER.x,PLAYER.y,PLAYER.z,h)) return false;
  let lo=PLAYER[axis]-d, hi=PLAYER[axis];
  for(let i=0;i<12;i++){
    const mid=(lo+hi)/2;
    PLAYER[axis]=mid;
    if(collides(PLAYER.x,PLAYER.y,PLAYER.z,h)) hi=mid; else lo=mid;
  }
  PLAYER[axis]=lo;
  return true;
}
function updatePlayer(dt){
  const keys=INPUT.keys;
  let mx=(keys.has("KeyD")?1:0)-(keys.has("KeyA")?1:0);
  let mz=(keys.has("KeyW")?1:0)-(keys.has("KeyS")?1:0);
  const inWater=isInWater();
  let speed=PLAYER.flying?FLY:WALK;
  if(PLAYER.sneak) speed*=0.5;
  if(inWater) speed*=0.6;
  const len=Math.hypot(mx,mz)||1;
  mx/=len; mz/=len;
  const yaw=camera.rotation.y;
  const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
  const rx=Math.cos(yaw), rz=-Math.sin(yaw);
  const dx=(rx*mx+fx*mz)*speed*dt, dz=(rz*mx+fz*mz)*speed*dt;
  if(PLAYER.flying){
    moveAxis("x",dx); moveAxis("z",dz);
    let vy=0;
    if(keys.has("Space")) vy=FLY*0.9;
    else if(keys.has("ShiftLeft")||keys.has("ShiftRight")) vy=-FLY*0.9;
    moveAxis("y",vy*dt);
  }else{
    moveAxis("x",dx); moveAxis("z",dz);
    PLAYER.velY -= G*(inWater?0.35:1)*dt;
    if(PLAYER.velY<-40) PLAYER.velY=-40;
    if(inWater && PLAYER.velY<-2.5) PLAYER.velY=-2.5;
    const dy=PLAYER.velY*dt;
    const hitGround = moveAxis("y",dy);
    if(dy<0 && hitGround){ PLAYER.onGround=true; PLAYER.velY=0; }
    else if(dy>0 && hitGround){ PLAYER.velY=0; }
    else PLAYER.onGround=false;
    if(keys.has("Space") && (PLAYER.onGround||inWater)){
      PLAYER.velY=inWater?3.2:JUMP;
      PLAYER.onGround=false;
    }
  }
  // 相机：第三人称（跟随+避障）或第一人称
  const eyeY = PLAYER.y+(PLAYER.sneak?1.15:EYE);
  if(INPUT.thirdPerson){
    const pitch=camera.rotation.x;
    const cp=Math.cos(pitch), sp=Math.sin(pitch);
    const fx2=-Math.sin(yaw)*cp, fy2=sp, fz2=-Math.cos(yaw)*cp;
    let dist=CAM_DIST;
    const back=raycast(PLAYER.x,eyeY,PLAYER.z,-fx2,-fy2,-fz2,CAM_DIST);
    if(back) dist=Math.max(0.5,back.t-0.2);
    camera.position.set(PLAYER.x-fx2*dist, eyeY-fy2*dist, PLAYER.z-fz2*dist);
  }else{
    camera.position.set(PLAYER.x, eyeY, PLAYER.z);
  }
  updatePlayerModel(dt);
}

/* ---------- 角色模型（第三人称可见） ---------- */
let playerModel=null, walkPhase=0;
function buildPlayerModel(){
  const group=new THREE.Group();
  const face=lambert(makeTexture(g=>{
    g.fillStyle="#e8b98a"; g.fillRect(0,0,16,16);
    g.fillStyle="#fff"; g.fillRect(4,6,3,3); g.fillRect(9,6,3,3);
    g.fillStyle="#3b6fd4"; g.fillRect(5,7,2,2); g.fillRect(10,7,2,2);
    g.fillStyle="#a05a4a"; g.fillRect(6,12,4,1);
    g.fillStyle="rgba(240,140,120,0.5)"; g.fillRect(3,10,2,2); g.fillRect(11,10,2,2);
  }));
  const skin=lambert(makeTexture(g=>noiseFill(g,"#e8b98a",10,0)));
  const hair=lambert(makeTexture(g=>noiseFill(g,"#5a3a22",14,8)));
  const shirt=lambert(makeTexture(g=>noiseFill(g,"#2e8b9e",12,4)));
  const pants=lambert(makeTexture(g=>noiseFill(g,"#3d4a63",12,4)));
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),[skin,skin,hair,skin,face,hair]);
  head.position.y=1.45;
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.7,0.3),shirt);
  body.position.y=0.85;
  const legGeo=new THREE.BoxGeometry(0.2,0.5,0.2); legGeo.translate(0,-0.25,0);
  const legL=new THREE.Mesh(legGeo,pants); legL.position.set(-0.15,0.5,0);
  const legR=new THREE.Mesh(legGeo.clone(),pants); legR.position.set(0.15,0.5,0);
  const armGeo=new THREE.BoxGeometry(0.17,0.52,0.17); armGeo.translate(0,-0.26,0);
  const armL=new THREE.Mesh(armGeo,skin); armL.position.set(-0.36,1.2,0);
  const armR=new THREE.Mesh(armGeo.clone(),skin); armR.position.set(0.36,1.2,0);
  group.add(head,body,legL,legR,armL,armR);
  group.userData={legL,legR,armL,armR,head,body};
  scene.add(group);
  return group;
}
function updatePlayerModel(dt){
  if(!playerModel) return;
  playerModel.visible = INPUT.thirdPerson;
  if(!INPUT.thirdPerson) return;
  const u=playerModel.userData;
  playerModel.position.set(PLAYER.x, PLAYER.y, PLAYER.z);
  playerModel.rotation.y=camera.rotation.y+Math.PI;
  const moving=INPUT.keys.has("KeyW")||INPUT.keys.has("KeyA")||INPUT.keys.has("KeyS")||INPUT.keys.has("KeyD");
  if(PLAYER.flying){
    walkPhase+=dt*4;
    u.armL.rotation.x=-Math.PI/2+Math.sin(walkPhase)*0.35;
    u.armR.rotation.x=-Math.PI/2-Math.sin(walkPhase)*0.35;
    u.legL.rotation.x=0; u.legR.rotation.x=0;
  }else if(moving && PLAYER.onGround){
    walkPhase+=dt*9;
    const s=Math.sin(walkPhase)*0.65;
    u.legL.rotation.x=s; u.legR.rotation.x=-s;
    u.armL.rotation.x=-s*0.8; u.armR.rotation.x=s*0.8;
  }else{
    u.legL.rotation.x=0; u.legR.rotation.x=0;
    u.armL.rotation.x=0; u.armR.rotation.x=0;
  }
  const sc=PLAYER.sneak?0.85:1;
  u.body.scale.y=sc;
  u.head.position.y=1.45*sc+(1-sc)*0.5;
}

/* ---------- DDA 射线 ---------- */
function raycast(ox,oy,oz,dx,dy,dz,maxDist){
  let x=Math.floor(ox), y=Math.floor(oy), z=Math.floor(oz);
  const stepX=dx>0?1:-1, stepY=dy>0?1:-1, stepZ=dz>0?1:-1;
  const tDX=dx!==0?Math.abs(1/dx):Infinity, tDY=dy!==0?Math.abs(1/dy):Infinity, tDZ=dz!==0?Math.abs(1/dz):Infinity;
  let tMX=dx!==0?(stepX>0?(x+1-ox):(ox-x))*tDX:Infinity;
  let tMY=dy!==0?(stepY>0?(y+1-oy):(oy-y))*tDY:Infinity;
  let tMZ=dz!==0?(stepZ>0?(z+1-oz):(oz-z))*tDZ:Infinity;
  let t=0, face=[0,0,0];
  for(let i=0;i<128;i++){
    if(tMX<tMY && tMX<tMZ){ x+=stepX; t=tMX; tMX+=tDX; face=[-stepX,0,0]; }
    else if(tMY<tMZ){ y+=stepY; t=tMY; tMY+=tDY; face=[0,-stepY,0]; }
    else { z+=stepZ; t=tMZ; tMZ+=tDZ; face=[0,0,-stepZ]; }
    if(t>maxDist) return null;
    const id=getBlock(x,y,z);
    if(id!==B.AIR && id!==B.WATER) return {x,y,z,face,id,t};
  }
  return null;
}
function aimRay(){ // 从玩家眼睛沿准星方向
  const yaw=camera.rotation.y, pitch=camera.rotation.x;
  const cp=Math.cos(pitch);
  return {
    ox: PLAYER.x, oy: PLAYER.y+(PLAYER.sneak?1.15:EYE), oz: PLAYER.z,
    dx: -Math.sin(yaw)*cp, dy: Math.sin(pitch), dz: -Math.cos(yaw)*cp
  };
}

/* ---------- 交互 ---------- */
function digBlock(){
  const a=aimRay();
  const hit=raycast(a.ox,a.oy,a.oz,a.dx,a.dy,a.dz,REACH);
  if(!hit||hit.id===B.BEDROCK) return;
  setBlock(hit.x,hit.y,hit.z,B.AIR);
  rebuildAt(hit.x,hit.y,hit.z);
  sfx("dig");
  markDirty();
}
function placeBlock(){
  const sel=TOOLBAR[INPUT.slot];
  const a=aimRay();
  const hit=raycast(a.ox,a.oy,a.oz,a.dx,a.dy,a.dz,REACH);
  if(!hit) return;
  const tx=hit.x+hit.face[0], ty=hit.y+hit.face[1], tz=hit.z+hit.face[2];
  if(ty<1||ty>=WY) return;
  const h=PLAYER.sneak?1.5:PLAYER_H;
  const x0=Math.floor(PLAYER.x-PLAYER_HW),x1=Math.floor(PLAYER.x+PLAYER_HW);
  const y0=Math.floor(PLAYER.y),y1=Math.floor(PLAYER.y+h);
  const z0=Math.floor(PLAYER.z-PLAYER_HW),z1=Math.floor(PLAYER.z+PLAYER_HW);
  if(tx>=x0&&tx<=x1&&ty>=y0&&ty<=y1&&tz>=z0&&tz<=z1) return;
  const old=getBlock(tx,ty,tz);
  if(old===B.BEDROCK) return;
  if(isSolid(old) && old!==B.WATER) return;
  setBlock(tx,ty,tz,sel);
  rebuildAt(tx,ty,tz);
  sfx("place");
  markDirty();
}

/* ---------- 音效 ---------- */
let AC=null, soundOn=true;
function ensureAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==="suspended") AC.resume();
}
function sfx(kind){
  if(!soundOn||!AC) return;
  const t=AC.currentTime;
  if(kind==="dig"){
    const len=0.09, buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=400+Math.random()*900; f.Q.value=1.2;
    const g=AC.createGain(); g.gain.value=0.3;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t);
  }else{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(160+Math.random()*40,t);
    g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+0.09);
  }
}

/* ---------- 存档 ---------- */
const SAVE_KEY="voxelcraft_world_v2";
function saveWorld(){
  try{
    let bin="";
    for(let i=0;i<world.length;i+=8192) bin+=String.fromCharCode.apply(null,world.subarray(i,i+8192));
    localStorage.setItem(SAVE_KEY,btoa(bin));
    return true;
  }catch(e){ return false; }
}
function loadWorld(){
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  try{
    const bin=atob(raw);
    if(bin.length!==world.length) return false;
    for(let i=0;i<world.length;i++) world[i]=bin.charCodeAt(i);
    return true;
  }catch(e){ return false; }
}
let dirty=false;
function markDirty(){ dirty=true; }
setInterval(()=>{ if(dirty){ dirty=false; saveWorld(); } }, 60000);
addEventListener("beforeunload",()=>{ if(dirty) saveWorld(); });

/* ---------- HUD ---------- */
const barCanvas=document.getElementById("bar"), barCtx=barCanvas.getContext("2d");
const ICON_TEX = {
  [B.GRASS]: TEX.grassSide, [B.DIRT]: TEX.dirt, [B.STONE]: TEX.stone,
  [B.LOG]: TEX.logSide, [B.LEAVES]: TEX.leaves, [B.SAND]: TEX.sand,
  [B.COAL]: TEX.coal, [B.IRON]: TEX.iron, [B.BEDROCK]: TEX.bedrock,
};
function drawToolbar(){
  barCtx.clearRect(0,0,barCanvas.width,barCanvas.height);
  const cell=40, gap=4, pad=2;
  barCanvas.width=TOOLBAR.length*(cell+gap)+pad*2;
  for(let i=0;i<TOOLBAR.length;i++){
    const x=pad+i*(cell+gap);
    barCtx.fillStyle="rgba(20,26,34,0.75)";
    barCtx.fillRect(x,pad,cell,cell);
    const t=ICON_TEX[TOOLBAR[i]];
    if(t) barCtx.drawImage(t.image,x+5,pad+5,cell-10,cell-10);
    if(i===INPUT.slot){
      barCtx.strokeStyle="#fff"; barCtx.lineWidth=2.5;
      barCtx.strokeRect(x-1,pad-1,cell+2,cell+2);
    }else{
      barCtx.strokeStyle="rgba(255,255,255,0.25)"; barCtx.lineWidth=1;
      barCtx.strokeRect(x,pad,cell,cell);
    }
  }
  document.getElementById("barname").textContent=BNAME[TOOLBAR[INPUT.slot]];
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.style.opacity=1;
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.style.opacity=0,1800);
}

/* ---------- 输入 ---------- */
const INPUT={ keys:new Set(), slot:0, sens:0.0022, thirdPerson:true };
function setSlot(i){ INPUT.slot=(i+TOOLBAR.length)%TOOLBAR.length; drawToolbar(); }
addEventListener("keydown",e=>{
  if(e.code==="Tab"){ e.preventDefault(); return; }
  INPUT.keys.add(e.code);
  if(!gameStarted) return;
  if(e.code==="KeyF"){ PLAYER.flying=!PLAYER.flying; PLAYER.velY=0;
    showToast(PLAYER.flying?"🕊 飞行模式 开启":"🚶 步行模式"); }
  if(e.code==="KeyC"){ INPUT.thirdPerson=!INPUT.thirdPerson;
    showToast(INPUT.thirdPerson?"🎥 第三人称视角":"👁 第一人称视角"); }
  if(e.code==="KeyM"){ soundOn=!soundOn; ensureAudio(); showToast(soundOn?"🔊 音效：开":"🔇 音效：关");
    const b=document.getElementById("btnSound"); if(b) b.textContent=soundOn?"🔊 音效：开":"🔇 音效：关"; }
  if(e.code.startsWith("Digit")){
    const n=parseInt(e.code.slice(5),10);
    if(n>=1&&n<=9) setSlot(n-1);
  }
});
addEventListener("keyup",e=>INPUT.keys.delete(e.code));
renderer.domElement.addEventListener("mousedown",e=>{
  if(!gameStarted) return;
  if(e.button===0) digBlock();
  else if(e.button===2) placeBlock();
});
renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("wheel",e=>{ if(gameStarted) setSlot(INPUT.slot+(e.deltaY>0?1:-1)); },{passive:true});
document.addEventListener("pointerlockchange",()=>{
  if(document.pointerLockElement===renderer.domElement){
    document.getElementById("pause").classList.add("hidden");
  }else if(gameStarted){
    document.getElementById("pause").classList.remove("hidden");
  }
});
document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==renderer.domElement) return;
  camera.rotation.y-=e.movementX*INPUT.sens;
  camera.rotation.x-=e.movementY*INPUT.sens;
  const lim=INPUT.thirdPerson?1.15:1.55;
  camera.rotation.x=Math.max(-1.45,Math.min(lim,camera.rotation.x));
});
document.getElementById("sens").addEventListener("input",e=>{
  INPUT.sens=0.0016+parseFloat(e.target.value)*0.0012;
});

/* ---------- 流程 ---------- */
let gameStarted=false;
function findSpawn(){
  const cx=WX/2, cz=WZ/2;
  for(let r=0;r<30;r++){
    for(let dx=-r;dx<=r;dx++) for(let dz=-r;dz<=r;dz++){
      if(Math.abs(dx)!==r && Math.abs(dz)!==r) continue;
      const x=cx+dx, z=cz+dz;
      if(x<2||z<2||x>=WX-2||z>=WZ-2) continue;
      let y=WY-2; while(y>0 && getBlock(x,y,z)===B.AIR) y--;
      if(getBlock(x,y,z)===B.GRASS) return {x:x+0.5, y:y+1, z:z+0.5};
    }
  }
  return {x:cx+0.5, y:SEA+3, z:cz+0.5};
}
function startWorld(newWorld){
  const loading=document.getElementById("loading");
  loading.classList.remove("hidden");
  document.getElementById("menu").classList.add("hidden");
  setTimeout(()=>{
    if(newWorld) genWorld();
    rebuildWorld();
    loading.classList.add("hidden");
    gameStarted=true;
    dirty=false;
    const sp=findSpawn();
    PLAYER.x=sp.x; PLAYER.z=sp.z;
    PLAYER.y=sp.y; PLAYER.velY=0; PLAYER.flying=false;
    camera.rotation.set(0,0,0);
    requestLock();
  },60);
}
function requestLock(){
  try{
    const p = renderer.domElement.requestPointerLock();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}

/* ---------- 菜单 ---------- */
document.getElementById("btnStart").addEventListener("click",()=>{ ensureAudio(); startWorld(true); });
document.getElementById("btnContinue").addEventListener("click",()=>{
  ensureAudio();
  if(loadWorld()) startWorld(false);
  else{ showToast("没有找到存档，将创建新世界"); startWorld(true); }
});
document.getElementById("btnResume").addEventListener("click",requestLock);
document.getElementById("btnSave").addEventListener("click",()=>{
  showToast(saveWorld()?"💾 世界已保存到浏览器":"⚠ 保存失败");
});
document.getElementById("btnSound").addEventListener("click",()=>{
  soundOn=!soundOn; ensureAudio();
  document.getElementById("btnSound").textContent=soundOn?"🔊 音效：开":"🔇 音效：关";
});
document.getElementById("btnRegen").addEventListener("click",()=>{
  if(!confirm("重新生成世界？当前世界修改将丢失（可先保存）。")) return;
  saveWorld();
  document.getElementById("pause").classList.add("hidden");
  startWorld(true);
});

/* ---------- 主循环 ---------- */
const infoEl=document.getElementById("info");
let last=performance.now(), fpsAcc=0, fpsN=0, fpsVal=60, frameCount=0;
let hoverName="";
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  let dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;
  if(gameStarted){
    updatePlayer(dt);
    if(frameCount%4===0){
      const a=aimRay();
      const hit=raycast(a.ox,a.oy,a.oz,a.dx,a.dy,a.dz,REACH);
      hoverName=hit?BNAME[hit.id]||"":"";
    }
    fpsAcc+=dt; fpsN++;
    if(fpsAcc>=0.5){
      fpsVal=Math.round(fpsN/fpsAcc);
      fpsAcc=0; fpsN=0;
      infoEl.innerHTML=
        "⛏ "+hoverName+"<br>"+
        "📍 "+PLAYER.x.toFixed(1)+" / "+PLAYER.y.toFixed(1)+" / "+PLAYER.z.toFixed(1)+
        (PLAYER.flying?"  [飞行]":"")+
        (isInWater()?"  [水中]":"")+
        (INPUT.thirdPerson?"  [第三]":"  [第一]")+
        "<br>🖥 "+fpsVal+" FPS · 方块 "+TOOLBAR[INPUT.slot]+"";
    }
  }
  frameCount++;
  renderer.render(scene,camera);
}
drawToolbar();
playerModel=buildPlayerModel();
animate();
</script>
